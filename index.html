<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baile do Limiar</title>
<meta name="description" content="Uma correspondência da Casa Tepes.">
<meta property="og:title" content="Baile do Limiar">
<meta property="og:description" content="Uma correspondência da Casa Tepes.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0306">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icone.svg" type="image/svg+xml">
<link rel="preload" href="assets/fontes/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fontes/cormorant-sc-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body data-estado="carregando">

<main class="cena" id="cena">
  <div class="veludo" aria-hidden="true"></div>
  <div class="veludo-pelo" aria-hidden="true"></div>

  <!-- palco do envelope -->
  <div class="palco" id="palco">
    <div class="envelope-giro" id="envelopeGiro">
      <div class="envelope" id="envelope">
        <div class="env-sombra" aria-hidden="true"></div>
        <svg class="env-costas" id="envCostas" aria-hidden="true"></svg>
        <!-- a carta (folha) entra aqui enquanto está no envelope -->
        <div class="folha-vaga" id="vagaEnvelope"></div>
        <svg class="env-frente" id="envFrente" aria-hidden="true"></svg>
        <div class="aba" id="aba" aria-hidden="true">
          <svg class="aba-face aba-fora" id="abaFora"></svg>
          <svg class="aba-face aba-dentro" id="abaDentro"></svg>
        </div>
        <div class="fragmentos" id="fragmentos" aria-hidden="true"></div>
        <button class="lacre" id="lacre" type="button" aria-label="Selo de cera roxa com o brasão da Casa Tepes. Pressione para quebrar.">
          <span class="lacre-sombra" aria-hidden="true"></span>
          <span class="lacre-arte" id="lacreArte" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <div class="luz" id="luz" aria-hidden="true"></div>
</main>

<!-- camada de leitura: a carta vem para cá depois de retirada -->
<section class="leitura" id="leitura" aria-label="Carta">
  <div class="leitura-trilho" id="vagaLeitura"></div>
</section>

<!-- a folha: uma única peça que passa do envelope para a leitura -->
<template id="modeloFolha">
  <article class="folha" id="folha" lang="pt-BR">
    <div class="folha-sombra" aria-hidden="true"></div>
    <div class="folha-corpo">
      <div class="folha-papel" aria-hidden="true"></div>
      <div class="folha-vinco" aria-hidden="true"></div>
      <div class="fibras fibras-pista" aria-hidden="true"></div>
      <div class="fibras fibras-revelacao" aria-hidden="true"></div>
      <svg class="moldura" aria-hidden="true"></svg>
      <div class="folha-brilho" aria-hidden="true"></div>

      <div class="camada camada-publica" id="camadaPublica">
        <p class="saudacao"><em>À distinta presença de Vossa Senhoria,</em></p>
        <p>É com elevada estima e sincera satisfação que a ilustre <strong>Casa Tepes</strong> tem a honra de convidar Vossa Senhoria a tomar parte nas celebrações do <strong>Baile do Limiar</strong>, a realizar-se no último crepúsculo do ano de 2627 da Era dos Planos.</p>
        <p>Por ocasião desta singular passagem entre o ano que se encerra e aquele que há de nascer, os salões do <strong>Solar Tepes — Mansão da Rosa Notívara</strong>, no Vale de Lício, abrirão suas portas para uma noite dedicada à música, às belas-artes, à dança e aos mais refinados prazeres da boa companhia.</p>
        <p>Sob a luz dos candelabros e entre os jardins em flor, será servido um banquete em honra ao ano findo, seguido de apresentações musicais e das tradicionais danças que antecedem a última badalada.</p>
        <p>Que as preocupações do mundo permaneçam além de nossos portões e que, por uma noite, somente a beleza, a cortesia e os encantos da ocasião nos façam companhia.</p>
        <p class="destaque"><strong>Vossa presença será recebida como uma honra singular.</strong></p>
        <p class="fecho">Com os mais distintos cumprimentos,</p>
        <p class="assinatura"><strong class="nome">Lady Ofélia Tepes</strong><br><em class="em-nome">Em nome de Suas Excelências, o Conde Roderic e a Condessa Christabel Tepes.</em></p>
        <hr class="divisor">
        <dl class="detalhes">
          <div><dt>Dia:</dt> <dd>Dia do Limiar, 2627 E.P.</dd></div>
          <div><dt>Horário:</dt> <dd>Ao cair do último crepúsculo.</dd></div>
          <div><dt>Local:</dt> <dd>Solar Tepes — Mansão da Rosa Notívara, Vale de Lício.</dd></div>
          <div><dt>Traje:</dt> <dd>Gala formal.</dd></div>
        </dl>
        <p class="nota"><em>Solicita-se a apresentação deste convite à chegada à propriedade.</em></p>
      </div>

      <!-- preenchida pelo script; fica oculta para leitores de tela até a descoberta -->
      <div class="camada camada-oculta" id="camadaOculta" aria-hidden="true" inert></div>

      <button class="marca" id="marca" type="button" aria-label="Pequena marca ornamental junto à assinatura. Aproximar a vela.">
        <svg viewBox="-20 -20 40 40" aria-hidden="true">
          <circle class="marca-anel" r="17" pathLength="100"/>
          <g class="marca-desenho">
            <path d="M0 -11 C4 -11 6 -7 4.5 -4 C8 -5 11 -2 10 2 C9 5 5 5.5 3.5 4 C4.5 8 2 11 0 11 C-2 11 -4.5 8 -3.5 4 C-5 5.5 -9 5 -10 2 C-11 -2 -8 -5 -4.5 -4 C-6 -7 -4 -11 0 -11Z"/>
            <circle r="2.6"/>
            <path class="marca-lua" d="M-13 9 A15 15 0 0 0 13 9 A12 12 0 0 1 -13 9Z"/>
          </g>
        </svg>
      </button>
    </div>
    <div class="dobra" aria-hidden="true"></div>
  </article>
</template>

<!-- vela: arraste pelo suporte -->
<div class="vela" id="vela" role="button" tabindex="0"
     aria-label="Vela. Arraste pelo suporte ou use as setas do teclado para movê-la."
     aria-describedby="velaAjuda">
  <svg viewBox="0 0 120 240" aria-hidden="true">
    <defs>
      <linearGradient id="vPrata" x1="0" x2="1">
        <stop offset="0" stop-color="#3a353c"/><stop offset=".35" stop-color="#b9b2bd"/>
        <stop offset=".55" stop-color="#efe9f1"/><stop offset="1" stop-color="#4a444d"/>
      </linearGradient>
      <linearGradient id="vPrataV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d9d2dc"/><stop offset="1" stop-color="#4b454f"/>
      </linearGradient>
      <linearGradient id="vCera" x1="0" x2="1">
        <stop offset="0" stop-color="#8f7f68"/><stop offset=".3" stop-color="#e9dfcb"/>
        <stop offset=".6" stop-color="#fff7e6"/><stop offset="1" stop-color="#9d8c73"/>
      </linearGradient>
      <radialGradient id="vChamaFora" cx=".5" cy=".75" r=".6">
        <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#ffb347"/>
        <stop offset=".8" stop-color="#e2541c" stop-opacity=".85"/><stop offset="1" stop-color="#a02a10" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="vAura" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffcf80" stop-opacity=".55"/><stop offset=".5" stop-color="#ff9a40" stop-opacity=".16"/>
        <stop offset="1" stop-color="#ff8a30" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse class="vela-sombra" cx="64" cy="218" rx="54" ry="13" fill="#000" opacity=".45"/>
    <!-- prato espelhado -->
    <ellipse cx="60" cy="212" rx="52" ry="14" fill="url(#vPrataV)"/>
    <ellipse cx="60" cy="209" rx="52" ry="13" fill="url(#vPrata)"/>
    <ellipse cx="60" cy="207.5" rx="44" ry="10" fill="#2b272e" opacity=".5"/>
    <ellipse cx="60" cy="207" rx="38" ry="7.5" fill="url(#vPrataV)" opacity=".35"/>
    <path d="M24 205 C34 199 50 198 60 198" fill="none" stroke="#f4f0f6" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
    <!-- alça em voluta com apoio de polegar -->
    <path d="M106 205 C124 203 126 180 110 177 C101 176 99 186 106 188" fill="none" stroke="url(#vPrata)" stroke-width="5" stroke-linecap="round"/>
    <path d="M108 178 C110 172 116 170 119 173" fill="none" stroke="url(#vPrata)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- arandela torneada -->
    <path d="M46 204 C46 198 50 196 50 192 H70 C70 196 74 198 74 204 Z" fill="url(#vPrata)"/>
    <ellipse cx="60" cy="192" rx="12" ry="3" fill="url(#vPrataV)"/>
    <path d="M51 192 V185 H69 V192 Z" fill="url(#vPrata)"/>
    <ellipse cx="60" cy="185" rx="15" ry="4" fill="#d8d1db"/>
    <ellipse cx="60" cy="185" rx="10" ry="2.4" fill="#4a444d" opacity=".5"/>
    <!-- vela fina de cera -->
    <path d="M52 100 V186 H68 V100 Z" fill="url(#vCera)"/>
    <path d="M52 100 C52 106 53.5 112 52.6 122 C52 129 55.6 130 55.8 123 C56 114 56.4 107 57.5 102 Z" fill="#f6ecd6"/>
    <path d="M65.5 101 C66.4 108 68 114 67.2 130 C66.8 140 69.6 141 69.8 132 C70 118 69 108 68 101 Z" fill="#f0e4cb"/>
    <path d="M58 101 C58.6 104 59.2 107 59 111 C58.9 113 60.4 113 60.5 111 C60.6 107 60.6 104 61 101 Z" fill="#fbf4e3"/>
    <path d="M52 100 C54 97 57 96.4 60 96.4 C63 96.4 66 97 68 100 C64 101.6 56 101.6 52 100 Z" fill="#f6ecd8"/>
    <ellipse cx="60" cy="99.2" rx="5" ry="1.4" fill="#d9c9ad"/>
    <path d="M67.6 186 C68.6 182 70 181 70.4 184 C70.6 186 69.4 187 67.6 186 Z" fill="#efe3cb"/>
    <path d="M60 99 C59 95 61 93 60 90" stroke="#1b1310" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- chama -->
    <g class="chama">
      <circle class="chama-aura" cx="60" cy="72" r="46" fill="url(#vAura)"/>
      <g class="chama-corpo">
        <path d="M60 40 C66 54 71 66 70 76 C69 86 64 92 60 92 C56 92 51 86 50 76 C49 66 54 54 60 40Z" fill="url(#vChamaFora)"/>
        <path d="M60 58 C63 66 65 73 64.5 80 C64 86 62 89 60 89 C58 89 56 86 55.5 80 C55 73 57 66 60 58Z" fill="#fff6d8"/>
        <ellipse cx="60" cy="88" rx="3.4" ry="4" fill="#5f7bd8" opacity=".55"/>
      </g>
    </g>
  </svg>
</div>
<p class="sr-only" id="velaAjuda">A luz da vela revela o que a tinta comum não mostra.</p>

<!-- controles discretos -->
<div class="controles" role="group" aria-label="Som e correspondência">
  <button class="ctl" id="btnSom" type="button" aria-pressed="false" aria-label="Silenciar a música">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="ic-alto" d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/>
      <path class="ic-onda" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.6 6.8a7.4 7.4 0 0 1 0 10.4" fill="none"/>
      <path class="ic-mudo" d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none"/>
    </svg>
  </button>
  <label class="ctl-volume">
    <span class="sr-only">Volume</span>
    <input type="range" id="volume" min="0" max="100" step="1" value="30" aria-label="Volume">
  </label>
  <button class="ctl" id="btnReiniciar" type="button" aria-label="Recomeçar a correspondência" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12a6.5 6.5 0 1 0 2.1-4.8" fill="none"/><path d="M5 4.5v4h4" fill="none"/></svg>
  </button>
</div>

<!-- alternância entre as duas versões, aparece só depois da descoberta -->
<div class="fita" id="fita" role="group" aria-label="Versão da carta" hidden>
  <button type="button" id="verConvite" aria-pressed="true">Convite</button>
  <button type="button" id="verOculta" aria-pressed="false">Tinta oculta</button>
</div>

<button class="pular" id="pular" type="button" hidden>Mostrar o texto inteiro</button>
<p class="dica" id="dica" aria-hidden="true"></p>
<p class="sr-only" id="anuncio" aria-live="polite"></p>

<audio id="musica" src="assets/musica/heroes-and-villains.mp3" preload="auto" loop></audio>

<noscript><p class="sem-script">Esta correspondência precisa de JavaScript para ser aberta.</p></noscript>
<script src="convite.js"></script>
</body>
</html>
